# Valine 评论模块的配置，默认为不激活，如要使用，就请激活该配置项，并设置 appId 和 appKey.
valine:
  enable: true
  appid: ldZ7GUJGyRY2rCvf8gpAkXvS-gzGzoHsz
  appkey: CnALuVOiJH2QVfBxHPtaxo6f
  notify: true
  verify: false# 验证码 默认为false
  placeholder: 'PasT.因你而更加精彩'
  avatar: monsterid # 头像风格，默认为mm，可进入网址：https://valine.js.org/visitor.html查看头像设置，这里有许多头像风格，进行设置
