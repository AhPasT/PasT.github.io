      <h1>雨</h1>
      <span class="diary-date">2026-09-20</span>
      <p>我很少带伞。<br>也很少见雨。  </p>
<p>每次碰到下雨天，<br>我反而会有一种莫名的向往，<br>总想着去走进雨里淋一会儿。  </p>
<p>什么也不想，<br>就这么走着。  </p>
<p>天在下大雨，<br>我在下小雨。  </p>
<p>正准备进宿舍，<br>小妹突然打来电话。  </p>
<p>“你怎么洗头了？”<br>哦<br>今天连洗澡都省了。  </p>
